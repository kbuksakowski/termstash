name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The leak check gates everything: fixtures are
  # transcripts, this repository is meant to be public, and a push is not
  # retractable - so nothing else is worth running until this passes.
  fixtures:
    name: Fixture leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run test/fixtures-leak.test.ts

  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    needs: fixtures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux are both supported; this matrix is the evidence for
        # that claim. Node 20 is the floor in engines.
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Drives the built CLI through the whole lifecycle against a synthetic
      # storage tree. This is the evidence section 5.6 asks for before calling
      # a platform supported - not "the unit tests pass" on it.
      - name: Lifecycle smoke test
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/smoke-claude
          TERMSTASH_HOME: ${{ runner.temp }}/smoke-termstash
        run: node scripts/smoke-test.mjs
